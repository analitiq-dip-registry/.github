name: Validate Definitions (reusable)

# Central validation for all analitiq-dip-registry connector repos.
# Each repo references this via a thin caller (stub) workflow; the logic lives here only.
# on: workflow_call means this file never runs on its own — it is inert until a caller invokes it.
#
# Two independent jobs run here:
#
#   validate     — analitiq-validate over the JSON definition files (.template#19):
#                  model-driven, covering both document shape and semantic rules,
#                  offline. Installs exact PyPI releases of analitiq-validator +
#                  analitiq-contract-models, both from the VALIDATOR_VERSION job env.
#   conformance  — tier-1 analitiq-cdk conformance over the connector's Python
#                  (.github#8): the definition files can be perfect while
#                  connector.py is broken against the CDK it is built on.
#
# Update here once; every caller picks both up on its next PR run. Roll a new
# validator or CDK out to every DIP PR by setting the org variable, not by editing
# this file.
on:
  workflow_call:

jobs:
  # In a caller repo the status check is named "<caller-job> / <this-job>".
  # The stub's caller job is 'validate' and this job is 'validate', so the check is
  # 'validate / validate'. The org ruleset 'Require validate check on main' must require
  # that exact context (it currently requires the bare 'validate' produced by the old
  # per-repo workflow).
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Single source of truth for the validator release. GitHub evaluates `vars`
      # in a reusable workflow against the CALLER's repo, so precedence here is:
      # caller repo variable > org variable > the literal below. Roll a new validator out
      # org-wide by setting the org variable VALIDATOR_VERSION; a repo that must stay on
      # an older validator sets a repo variable of the same name, which shadows the org
      # value for that repo only. No repo variable = follow the org — never seed one at
      # repo-creation time, or that repo silently stops tracking org-wide bumps.
      #
      # The literal is a last-known-good floor, NOT a mirror of the org variable. PRs from
      # forks receive no org or repo variables at all, and an unset `vars` entry expands to
      # an empty string, which would make the pip spec below invalid and fail every outside
      # contributor's PR. Bump it occasionally, not on every rc. Consequence to know about:
      # on a repo deliberately held back by a repo variable, fork PRs validate against this
      # floor rather than that repo's pin.
      VALIDATOR_VERSION: ${{ vars.VALIDATOR_VERSION || '1.0.0rc17' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Contract-model shape checks plus the semantic validators (type-map-coverage,
      # expression-resolver, auth-shape, tls-consistency, endpoint-annotations, …).
      # The semantic pass is what catches a connector whose endpoints reference
      # native types its read map doesn't resolve — the defect that shipped
      # `sevdesk` broken.
      #
      # Pinned to an exact PyPI pre-release. (--pre is redundant here — pip honours
      # an exact `==` pin of a pre-release on its own — but harmless, and left in
      # place so this step is not re-litigated on every read.)
      # analitiq-contract-models is installed at the SAME release as
      # analitiq-validator: the validator imports the contract models, and leaving
      # the models unpinned lets pip float them to a newer pre-release whose shape
      # the pinned validator can't import (e.g. rc1 validator + rc13 models →
      # "cannot import name 'ConnectorConfig'"). Deriving both from the single
      # VALIDATOR_VERSION env above makes that invariant structural rather than a
      # thing to remember when bumping.
      #
      # The echo is deliberate: the version lives in org/repo settings rather than in
      # this file, so the run log is the only record of which validator release
      # actually gated a given PR.
      - name: Install validator
        run: |
          set -euo pipefail
          echo "Validator: ${VALIDATOR_VERSION}"
          python3 -m pip install --pre \
            "analitiq-validator==${VALIDATOR_VERSION}" \
            "analitiq-contract-models==${VALIDATOR_VERSION}"

      - name: Validate definitions
        run: |
          set -euo pipefail

          # Validation needs no network and no schema host — it is model-driven
          # and fully offline. (--semantic-only on the calls below is a no-op for the
          # current validator, which is always offline; it is kept for compatibility
          # with validator releases that still parse it.)
          #
          # connector.json is mandatory in every repo, scaffold included, so this
          # check sits outside the skip below.
          #
          # Keep it unconditional: the `conformance` job below deliberately does
          # NOT re-report a missing connector.json, so this is the only check that
          # catches it. Guarding it behind an `if:` or a path filter would make that
          # file's absence pass both jobs.
          if [ ! -f definition/connector.json ]; then
            echo "ERROR: definition/connector.json is missing."
            exit 1
          fi

          # Run the rule pass only when there is a real definition to check. An
          # unconfigured template scaffold (no endpoints AND no read map) has
          # nothing to cover, so skip it. A real api connector has endpoints; a
          # real database connector has type-map-read.json; either triggers the
          # full pass.
          ENDPOINTS=()
          if [ -d definition/endpoints ]; then
            mapfile -d '' -t ENDPOINTS < <(find definition/endpoints -name "*.json" -type f -print0)
          fi

          if [ "${#ENDPOINTS[@]}" -eq 0 ] && [ ! -f definition/type-map-read.json ]; then
            echo "No endpoints and no type-map-read.json — unconfigured template scaffold; skipping rule pass."
            exit 0
          fi

          # Coverage is anchored on the connector: it discovers the sibling
          # type-map-read.json and endpoints/ from definition/ and fails if an
          # endpoint native is unresolved by the read map.
          echo "--- definition/connector.json ---"
          analitiq-validate --document definition/connector.json --semantic-only

          # Type-map rule checks (read always; write for database connectors).
          for m in definition/type-map-read.json definition/type-map-write.json; do
            if [ -f "$m" ]; then
              echo "--- $m ---"
              analitiq-validate --document "$m" --semantic-only
            fi
          done

          # Per-endpoint annotation checks.
          for ep in "${ENDPOINTS[@]}"; do
            echo "--- $ep ---"
            analitiq-validate --document "$ep" --semantic-only
          done

  # Tier-1 CDK conformance (.github#8). The `validate` job above never imports
  # connector.py, so a connector can be green on every definition file and still
  # break at runtime: a wrong sqlalchemy_registry_name, a dialect package missing
  # from requirements.txt, an unsanctioned override of a CDK hook.
  #
  # A separate job rather than steps inside `validate`, for two reasons: the CDK +
  # connector install must not share a dependency resolution with the validator
  # install, and an independent failure signal is more readable. In a caller repo
  # the stub's job is 'validate' and this job is 'conformance', so the status check
  # is 'validate / conformance'.
  #
  # Tier 2 (live read/write against a real server) needs a service container matched
  # to each system — postgres vs. mysql vs. snowflake — which a shared workflow_call
  # cannot supply generically, and cloud warehouses have no containerizable server at
  # all. Tier 2 stays opt-in per connector repo.
  conformance:
    runs-on: ubuntu-latest

    # Merging this file must not switch the gate on everywhere at once. Every caller
    # stub resolves this workflow at @main with no tag or SHA pin, so a live job
    # reaches all 13 connector repos on their next PR run — including repos whose
    # connector does not pass tier 1 yet, and including the window before the pinned
    # CDK is on PyPI. Turn it on deliberately, org-wide, by setting the org variable
    # CDK_CONFORMANCE_ENABLED to 'true'.
    #
    # A job-level `if` is also the only construct that renders as *Skipped* (grey)
    # rather than as a passing check, so "switched off" does not read as "passed" in
    # the checks list. Note the limit of that: GitHub treats a skipped job as
    # SATISFYING a required status check, so this is honest reporting, not
    # protection. 'validate / conformance' must not be added to the org ruleset
    # while any repo can take a skip path — see the gate step below.
    if: vars.CDK_CONFORMANCE_ENABLED == 'true'

    permissions:
      contents: read
    env:
      # Same precedence contract as VALIDATOR_VERSION above: caller repo variable >
      # org variable > the literal floor, because GitHub evaluates `vars` in a
      # reusable workflow against the CALLER's repo. Roll a new CDK out org-wide by
      # setting the org variable CDK_VERSION, not by editing this file. The literal
      # is a last-known-good floor for fork PRs, which receive no org or repo
      # variables and would otherwise expand it to an empty, invalid pip spec.
      #
      # The floor must name a release whose kit FAILS a connector kind it cannot
      # assess (analitiq-engine#414). 0.2.0rc1 predates that fix: run against the
      # `pipedrive` definition it reports 4 passed / 20 skipped and exits 0, so green
      # there means "not assessed", not "passed". The install step below enforces the
      # floor on the RESOLVED value, since the variable that actually decides is set
      # in org/repo settings where this comment is not visible.
      CDK_VERSION: ${{ vars.CDK_VERSION || '0.2.0rc2' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Unlike `validate`, which only ever parses JSON, this job executes
          # PR-controlled code three times over: the fork's build backend under
          # build isolation, its requirements.txt, and connector.py itself when
          # pytest imports it. Don't leave the job token in .git/config for that
          # code to read. Corollary: caller stubs must never gain `secrets: inherit`.
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'   # the kit's floor is 3.11

      - name: Detect an installable connector
        id: gate
        run: |
          set -euo pipefail

          # A missing connector.json is already a hard failure in `validate`, which
          # runs against this same commit: every caller stub invokes this file from
          # a single job, so both jobs always share a run and a checkout, and
          # validate's check sits above its own scaffold skip, so it is
          # unconditional. Conformance defers rather than reporting one defect as
          # two red checks.
          if [ ! -f definition/connector.json ]; then
            echo "::warning::No definition/connector.json — tier-1 conformance NOT ASSESSED. The validate job is expected to fail on the same file; if it did not, look there first."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Tier 1 imports the connector class through its entry point, so it needs
          # an installable package. Definition-only repos have no pyproject.toml and
          # nothing to import — `pip install .` there fails outright with
          # "Directory '.' is not installable".
          #
          # Packaging such a repo is NOT a no-op for `kind: api`: tier 1 declares
          # APPLIES_TO_KINDS = ("database",) in both test_read_path and
          # test_rendering, so against the post-#414 kit a packaged api connector
          # FAILS the applicability check rather than passing it. Real API coverage
          # is analitiq-engine#415; until it lands, the packaging path is open to
          # database connectors only.
          #
          # Every repo that takes this branch is ungated, which is why
          # 'validate / conformance' cannot become a required ruleset context yet:
          # a required check is satisfied by this path while verifying nothing.
          if [ ! -f pyproject.toml ]; then
            echo "::warning::No pyproject.toml — tier-1 conformance NOT ASSESSED: definition-only repo with no connector class to import."
            {
              echo "### Tier-1 conformance: NOT ASSESSED"
              echo
              echo "This repo ships definitions only (no \`pyproject.toml\`), so there is no"
              echo "connector class to import and \`pip install .\` would fail. Nothing about"
              echo "the connector's Python was verified by this run."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "run=true" >> "$GITHUB_OUTPUT"

      # Guards are `!= 'false'` rather than `== 'true'` so that a gate which fails to
      # produce a decision runs the suite instead of silently skipping it. (An `if:`
      # without a status function still carries the implicit success() check, so this
      # cannot resurrect the step after an earlier failure.)
      - name: Install pinned CDK + this connector
        if: steps.gate.outputs.run != 'false'
        run: |
          set -euo pipefail
          echo "Conformance CDK (requested): ${CDK_VERSION}"
          python3 -m pip install --quiet packaging

          # The floor documented above governs only the literal in this file. The
          # value that actually gates a normal PR comes from an org or repo variable,
          # so assert it here: a stale override must not silently restore a kit that
          # exits 0 on a connector kind it cannot assess.
          python3 - <<'PY'
          import os, sys
          from packaging.version import Version
          floor = Version("0.2.0rc2")
          got = Version(os.environ["CDK_VERSION"])
          if got < floor:
              sys.exit(
                  f"CDK_VERSION={got} is below the {floor} floor. Releases before "
                  f"{floor} exit 0 on a connector kind they cannot assess "
                  f"(analitiq-engine#414), which makes this gate vacuous. Refusing to run."
              )
          PY

          # ONE resolution for the CDK and the connector. Two separate `pip install`
          # calls do not share one: the second cannot see the first's constraints and
          # will downgrade a shared dependency to satisfy requirements.txt, at which
          # point pip prints "ERROR: ... dependency conflicts" and still exits 0
          # (verified). A gate running against a different CDK than the one it just
          # echoed is worse than no gate. Installing the connector is required for
          # tier 1, not just tier 2 — the suite resolves a SQLAlchemy dialect for the
          # declared driver and fails, not skips, when the dialect package is absent
          # from the connector's requirements or sqlalchemy_registry_name is wrong.
          python3 -m pip install "analitiq-cdk[conformance]==${CDK_VERSION}" .

          # pip exits 0 on an inconsistent resolution; pip check exits 1. This is the
          # step that turns that warning into a failure.
          python3 -m pip check

          # ...and prove the pin survived, so the echoed version is a record rather
          # than a claim.
          python3 - <<'PY'
          import os, sys
          from importlib.metadata import version
          from packaging.version import Version
          want, got = os.environ["CDK_VERSION"], version("analitiq-cdk")
          if Version(got) != Version(want):
              sys.exit(f"CDK pin not honoured: requested {want}, installed {got}")
          print(f"Conformance CDK (installed, verified): {got}")
          PY

      - name: Tier 1 conformance
        if: steps.gate.outputs.run != 'false'
        run: |
          set -euo pipefail

          # -p cdk.conformance.plugin registers the --connector-dir option; the kit
          # is deliberately not a pytest11 auto-load entry point. Discovery is by the
          # entry-point groups analitiq.source_connectors /
          # analitiq.destination_connectors, keyed (case-insensitively) on
          # name == connector_id, and a database connector with no custom class falls
          # back to GenericSQLConnector. No conftest, fixture, or opt-out file is
          # required from a connector repo: applicability is derived from
          # connector.json and there is no waiver mechanism by design.
          #
          # -o addopts= -o pythonpath= keeps that true. pytest resolves the
          # CONNECTOR's pyproject.toml as its configfile (verified: rootdir and
          # configfile land on the connector repo even from a neutral cwd), so any
          # repo's own [tool.pytest.ini_options] silently reconfigures this shared
          # gate — mysql already ships addopts and pythonpath, an addopts naming a
          # missing plugin hard-fails an otherwise valid PR, and `addopts = "--co"`
          # would exit 0 having executed nothing. Per-repo pytest ini is exactly the
          # waiver mechanism this suite is designed not to have.
          #
          # -rs prints skip reasons, so "passed" stays distinguishable from "not
          # assessed" in the log rather than being inferred from a bare count.
          pytest -p cdk.conformance.plugin \
            --pyargs cdk.conformance.tier1 \
            --connector-dir . \
            -o addopts= -o pythonpath= \
            -rs
