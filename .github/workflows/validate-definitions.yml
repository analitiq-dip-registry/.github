name: Validate Definitions (reusable)

# Central validation for all analitiq-dip-registry connector repos.
# Each repo references this via a thin caller (stub) workflow; the logic lives here only.
# on: workflow_call means this file never runs on its own — it is inert until a caller invokes it.
#
# Two independent jobs run here:
#
#   validate     — analitiq-validate over the JSON definition files (.template#19):
#                  model-driven, covering both document shape and semantic rules,
#                  offline. Installs exact PyPI releases of analitiq-validator +
#                  analitiq-contract-models, both from the VALIDATOR_VERSION job env.
#   conformance  — tier-1 analitiq-cdk conformance over the connector's Python
#                  (.github#8): the definition files can be perfect while
#                  connector.py is broken against the CDK it is built on.
#
# Update here once; every caller picks both up on its next PR run. Roll a new
# validator or CDK out to every DIP PR by setting the org variable, not by editing
# this file.
on:
  workflow_call:

jobs:
  # In a caller repo the status check is named "<caller-job> / <this-job>".
  # The stub's caller job is 'validate' and this job is 'validate', so the check is
  # 'validate / validate'. The org ruleset 'Require validate check on main' must require
  # that exact context (it currently requires the bare 'validate' produced by the old
  # per-repo workflow).
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Single source of truth for the validator release. GitHub evaluates `vars`
      # in a reusable workflow against the CALLER's repo, so precedence here is:
      # caller repo variable > org variable > the literal below. Roll a new validator out
      # org-wide by setting the org variable VALIDATOR_VERSION; a repo that must stay on
      # an older validator sets a repo variable of the same name, which shadows the org
      # value for that repo only. No repo variable = follow the org — never seed one at
      # repo-creation time, or that repo silently stops tracking org-wide bumps.
      #
      # The literal is a last-known-good floor, NOT a mirror of the org variable. PRs from
      # forks receive no org or repo variables at all, and an unset `vars` entry expands to
      # an empty string, which would make the pip spec below invalid and fail every outside
      # contributor's PR. Bump it occasionally, not on every rc. Consequence to know about:
      # on a repo deliberately held back by a repo variable, fork PRs validate against this
      # floor rather than that repo's pin.
      VALIDATOR_VERSION: ${{ vars.VALIDATOR_VERSION || '1.0.0rc17' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Contract-model shape checks plus the semantic validators (type-map-coverage,
      # expression-resolver, auth-shape, tls-consistency, endpoint-annotations, …).
      # The semantic pass is what catches a connector whose endpoints reference
      # native types its read map doesn't resolve — the defect that shipped
      # `sevdesk` broken.
      #
      # Pinned to an exact PyPI pre-release. (--pre is redundant here — pip honours
      # an exact `==` pin of a pre-release on its own — but harmless, and left in
      # place so this step is not re-litigated on every read.)
      # analitiq-contract-models is installed at the SAME release as
      # analitiq-validator: the validator imports the contract models, and leaving
      # the models unpinned lets pip float them to a newer pre-release whose shape
      # the pinned validator can't import (e.g. rc1 validator + rc13 models →
      # "cannot import name 'ConnectorConfig'"). Deriving both from the single
      # VALIDATOR_VERSION env above makes that invariant structural rather than a
      # thing to remember when bumping.
      #
      # The echo is deliberate: the version lives in org/repo settings rather than in
      # this file, so the run log is the only record of which validator release
      # actually gated a given PR.
      - name: Install validator
        run: |
          set -euo pipefail
          echo "Validator: ${VALIDATOR_VERSION}"
          python3 -m pip install --pre \
            "analitiq-validator==${VALIDATOR_VERSION}" \
            "analitiq-contract-models==${VALIDATOR_VERSION}"

      - name: Validate definitions
        run: |
          set -euo pipefail

          # Validation needs no network and no schema host — it is model-driven
          # and fully offline. (--semantic-only on the calls below is a no-op for the
          # current validator, which is always offline; it is kept for compatibility
          # with validator releases that still parse it.)
          #
          # connector.json is mandatory in every repo, scaffold included, so this
          # check sits outside the skip below.
          #
          # Keep it unconditional: the `conformance` job below deliberately does
          # NOT re-report a missing connector.json, so this is the only check that
          # catches it. Guarding it behind an `if:` or a path filter would make that
          # file's absence pass both jobs.
          if [ ! -f definition/connector.json ]; then
            echo "ERROR: definition/connector.json is missing."
            exit 1
          fi

          # Run the rule pass only when there is a real definition to check. An
          # unconfigured template scaffold (no endpoints AND no read map) has
          # nothing to cover, so skip it. A real api connector has endpoints; a
          # real database connector has type-map-read.json; either triggers the
          # full pass.
          ENDPOINTS=()
          if [ -d definition/endpoints ]; then
            mapfile -d '' -t ENDPOINTS < <(find definition/endpoints -name "*.json" -type f -print0)
          fi

          if [ "${#ENDPOINTS[@]}" -eq 0 ] && [ ! -f definition/type-map-read.json ]; then
            echo "No endpoints and no type-map-read.json — unconfigured template scaffold; skipping rule pass."
            exit 0
          fi

          # Coverage is anchored on the connector: it discovers the sibling
          # type-map-read.json and endpoints/ from definition/ and fails if an
          # endpoint native is unresolved by the read map.
          echo "--- definition/connector.json ---"
          analitiq-validate --document definition/connector.json --semantic-only

          # Type-map rule checks (read always; write for database connectors).
          for m in definition/type-map-read.json definition/type-map-write.json; do
            if [ -f "$m" ]; then
              echo "--- $m ---"
              analitiq-validate --document "$m" --semantic-only
            fi
          done

          # Per-endpoint annotation checks.
          for ep in "${ENDPOINTS[@]}"; do
            echo "--- $ep ---"
            analitiq-validate --document "$ep" --semantic-only
          done

  # Decides whether tier-1 conformance can say anything about this repo, in its own
  # job so that "cannot assess" renders as a grey *Skipped* job rather than as a
  # green check. That distinction is the whole point of analitiq-engine#414 applied
  # one layer up: a suite that reports success for an artifact it structurally
  # cannot evaluate is misreporting, and so is a CI job.
  #
  # Deliberately NOT gated on a `vars` flag: configuration variables are not passed
  # to workflows triggered by pull_request from a fork (community discussion
  # #44322 — same premise as the VALIDATOR_VERSION comment above), so any `vars`
  # condition would skip every outside contributor's PR forever, silently.
  conformance-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      # Whether the conformance job runs at all — "can the kit assess a connector
      # of this kind?".
      run: ${{ steps.gate.outputs.run }}
      # Whether that job's pip resolution includes this repo — "is there a package
      # to install?". Only meaningful when `run` is 'true'.
      install_self: ${{ steps.gate.outputs.install_self }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # For tomllib below. Don't rely on the runner image's system python3: this
      # gate must not start skipping repos the day ubuntu-latest moves to an image
      # whose default python predates 3.11.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Decide whether tier-1 conformance can assess this repo
        id: gate
        run: |
          set -euo pipefail

          # Two questions, answered separately (.github#11):
          #
          #   run          — can the kit assess a connector of this KIND at all?
          #                  Answered by `kind` in definition/connector.json.
          #   install_self — is there a package to add to the CDK's pip resolution?
          #                  Answered by the `[project]` table in pyproject.toml.
          #
          # Keying `run` on the package — as this gate did when it landed — skipped
          # every thin connector. A `kind: database` repo that ships no class of its
          # own is a path the CDK explicitly supports: with no entry point matching
          # connector_id, cdk/conformance/target.py resolves GenericSQLConnector, and
          # every check that does not need a bespoke class still applies. Skipping
          # those repos reported "not assessed" as a permanently green check, which
          # is the exact failure mode this job exists to remove.
          #
          # Parse the TOML rather than grepping for a `[project]` header. `[ project ]`,
          # `[project] # comment` and `["project"]` are all valid TOML declaring a real
          # package, and all three miss a `^\[project\]$` grep. A false negative there
          # no longer skips the job; it drops `.` from the install, and the suite
          # audits GenericSQLConnector in place of the repo's own class. The
          # ships-Python check below is what turns that into a red, which is why it
          # globs rather than testing a path.
          #
          # In the other direction `"project" in ...` is true for a pyproject whose
          # only project table is `[project.entry-points."…"]` — tomllib materialises
          # the implicit parent — so such a repo is called packaged and `pip install .`
          # goes red on the missing name/version. Red on a pyproject.toml that is
          # genuinely invalid under PEP 621 is the right end of that trade; the message
          # just comes from pip rather than from here.
          #
          # -P, because a `run:` step's cwd is the PR's own checkout and `python3 -`
          # would otherwise put it on sys.path: a root-level json.py or tomllib.py
          # shadowing the stdlib decides this gate's verdict before its first
          # statement. Verified — a hostile json.py returning `{"kind": "api"}` turns
          # a packaged database repo into a green gate and a skipped conformance job,
          # annotated as a routine api skip. The install step's two snippets take the
          # same precaution. The verify step deliberately does NOT: it answers a
          # question about sys.path itself, so it neutralises the checkout by running
          # from $RUN_DIR instead — see that step. The suite step never invokes
          # python3 at all, so -P was never a knob it had; its equivalents are that
          # same $RUN_DIR cwd plus `-o pythonpath=`.
          python3 -P - <<'PY'
          import json, os, pathlib, sys, tomllib

          root = pathlib.Path(os.environ["GITHUB_WORKSPACE"])

          # ConnectorKind in analitiq-contract-models is a CLOSED enum, so anything
          # outside this set is a malformed definition rather than a kind the kit has
          # yet to cover, and gets the hard failure below rather than the skip. Without
          # that split, `kind: Database` or `kind: databse` reads as "no checks for
          # this kind" and skips — and for a repo in the scaffold shape (no endpoints,
          # no read map) whose kind lands on that skip, this gate is the ONLY thing
          # that reads kind at all: `validate` short-circuits before analitiq-validate
          # sees the file, and no conformance job runs to have the kit read it either.
          # A one-character PR would silently revert this whole gate. Duplicating a
          # closed enum risks going stale, but stale here means a red on a valid new
          # kind: visible and immediately fixable, unlike a silent skip.
          KNOWN_KINDS = {"api", "database", "nosql", "document", "file", "s3", "stdout"}

          # Mirrors APPLIES_TO_KINDS in the kit's own tier-1 check modules
          # (test_read_path, test_rendering). Hardcoding it duplicates a declaration
          # that lives in the CDK, tolerable only while the answer is one kind: when
          # analitiq-engine#415 lands API coverage, this set has to grow with it or
          # every api repo stays silently ungated. Drift in the other direction is
          # self-reporting — a kind this gate admits that the kit cannot assess fails
          # test_a_check_applies_to_this_connector_kind (analitiq-engine#414) red.
          ASSESSABLE_KINDS = {"database"}

          def emit(name, value):
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
                  fh.write(f"{name}={value}\n")

          def summary(text):
              path = os.environ.get("GITHUB_STEP_SUMMARY")
              if path:
                  with open(path, "a", encoding="utf-8") as fh:
                      fh.write(text + "\n")

          # A missing connector.json is already a hard failure in `validate`, which runs
          # against this same commit: every caller stub invokes this file from a single
          # job, so both jobs always share a run and a checkout, and validate's check
          # sits above its own scaffold skip, so it is unconditional. Conformance defers
          # rather than reporting one defect as two red checks.
          definition_path = root / "definition" / "connector.json"
          if not definition_path.is_file():
              print(
                  "::warning::No definition/connector.json — tier-1 conformance NOT "
                  "ASSESSED. The validate job is expected to fail on the same file; "
                  "if it did not, look there first."
              )
              # Summarised as well as annotated, like the other two not-assessed
              # paths. The annotation is ephemeral; the summary is the durable record,
              # and three skips reported three different ways invites someone to
              # "simplify" the other two down to this one.
              summary(
                  "### Tier-1 conformance: NOT ASSESSED\n\n"
                  "There is no `definition/connector.json`, so there is nothing to "
                  "select checks from. The `validate` job fails on the same file."
              )
              emit("run", "false")
              sys.exit(0)

          # Present-but-unreadable gets no such deference, because `validate` does not
          # reliably cover it: its rule pass sits behind a scaffold skip (no endpoints
          # and no type-map-read.json), and a repo in that shape never hands the file
          # to analitiq-validate at all. Deferring here would leave nothing red
          # anywhere. Same reasoning as the pyproject.toml branch below: unparseable is
          # a defect, not an absence.
          try:
              definition = json.loads(definition_path.read_text(encoding="utf-8"))
          except (json.JSONDecodeError, UnicodeDecodeError) as err:
              sys.exit(f"definition/connector.json does not parse: {err}")
          if not isinstance(definition, dict):
              sys.exit(
                  f"definition/connector.json must be a JSON object, got "
                  f"{type(definition).__name__}."
              )

          # Fail rather than treating an absent kind as an unassessable one: the skip
          # path is for connectors the kit has no checks for, not for definitions it
          # cannot read. load_target refuses the same file for the same reason, but
          # only for a repo that gets past this gate.
          kind = definition.get("kind")
          if not isinstance(kind, str) or not kind:
              sys.exit(
                  "definition/connector.json declares no kind. Every connector "
                  "definition must declare one, and the conformance kit selects its "
                  "checks from it."
              )
          if kind not in KNOWN_KINDS:
              sys.exit(
                  f"definition/connector.json declares kind {kind!r}, which is not a "
                  f"connector kind. ConnectorKind is a closed enum: "
                  f"{', '.join(sorted(KNOWN_KINDS))}. (Matching is exact — "
                  f"'Database' and 'database ' are not 'database'.)"
              )

          pyproject = root / "pyproject.toml"
          declares_package = False
          if pyproject.is_file():
              try:
                  declares_package = "project" in tomllib.loads(
                      pyproject.read_text(encoding="utf-8")
                  )
              except (tomllib.TOMLDecodeError, UnicodeDecodeError) as err:
                  # Unparseable is a defect, not an absence. Falling through would turn
                  # a broken package declaration into a run that audits CDK code.
                  hint = ""
                  if pyproject.read_bytes().startswith(b"\xef\xbb\xbf"):
                      hint = (
                          " — the file starts with a UTF-8 BOM, which TOML does not "
                          "allow; save it without one"
                      )
                  sys.exit(f"pyproject.toml is present but does not parse: {err}{hint}")

          # Shipping connector code while declaring no installable package is a broken
          # connector, not a thin one: the engine resolves the class through an entry
          # point that only an installed package provides. Without this, a PR that
          # deletes or breaks pyproject.toml would silently convert an audited
          # connector into one audited through the CDK's generic fallback. Checked for
          # every kind, since the packaging contract does not depend on the kind.
          #
          # This is the check that makes "no [project] table" mean "thin" rather than
          # "unpackaged", so it must not key on a path. Keying it on `connector.py`
          # alone (as it did when it landed) let a src/ layout through, and keying it
          # on root + src/ still let a flat package directory through: the repo ships
          # real connector code, the gate calls it thin, the suite audits
          # GenericSQLConnector, and the two class-level checks pass vacuously — a
          # green certifying CDK code. That is .github#12, and widening the gate to
          # admit thin repos is what turns it from a silent skip into a silent pass.
          #
          # So: any .py anywhere. There is no layout-shaped answer here — setuptools
          # auto-discovery covers root and src/, but a backend configured to build
          # from elsewhere is just as installable — and every miss is a silent pass,
          # while every false positive is a red carrying an actionable message. A thin
          # repo with a stray helper script is told to package it or move it, which is
          # a worse day for one author than a silent green is for nobody.
          sources = sorted(
              path.relative_to(root).as_posix()
              for path in root.rglob("*.py")
              if ".git" not in path.relative_to(root).parts
          )
          if sources and not declares_package:
              detail = (
                  "pyproject.toml declares no [project] table"
                  if pyproject.is_file()
                  else "there is no pyproject.toml"
              )
              shown = ", ".join(sources[:5]) + (" …" if len(sources) > 5 else "")
              sys.exit(
                  f"this repo ships Python ({shown}) but {detail}. A connector that "
                  f"ships Python must declare an installable package in pyproject.toml "
                  f"— the engine resolves its class through an entry point that only an "
                  f"installed package provides, and tier-1 conformance cannot import it "
                  f"otherwise. (setup.py/setup.cfg packaging is pip-installable but not "
                  f"accepted here: the registry standardises on pyproject.toml.) If "
                  f"this file is not connector code, it still has to move: a repo with "
                  f"no package is audited as a thin connector, and nothing here can "
                  f"tell the difference. This applies at every kind, including the "
                  f"ones tier 1 does not yet assess — the packaging contract is not "
                  f"conditional on whether conformance would have run."
              )

          # A valid kind the kit has no behaviour checks for. Running anyway would go
          # RED, not green — 0.2.1's test_a_check_applies_to_this_connector_kind exists
          # to make "not assessed" a failure (analitiq-engine#414). Every api repo in
          # the catalogue exits 1 (verified: pipedrive and easybill 2 failed / 3 passed
          # / 20 skipped, xero, sevdesk and wise-api-key 1 failed / 5 passed / 19
          # skipped — clickhouse also exits 1, but on a connector_id defect that errors
          # at collection before applicability is reached). The applicability red is a
          # gap in the kit, which no connector author can act on, so the honest
          # rendering is a grey skip here rather than an unactionable failure there.
          #
          # Not a free trade, in two directions. First, a red blocks and a skip
          # SATISFIES a required check. Second, the skip does not discriminate: it
          # takes the kind-agnostic failures with it, and some of those ARE actionable
          # — the second failure on pipedrive and easybill is
          # test_connector_ships_a_read_type_map, and clickhouse's is a missing
          # connector_id. Suppressing those is the cost of suppressing the one nobody
          # can fix, and it is only worth paying while analitiq-engine#415 is
          # outstanding.
          #
          # Reached whether or not the repo declares a package, so packaging an api
          # connector no longer converts its skip into that red. That changes nothing
          # for the catalogue today — none of the six api repos declares a package, so
          # all six were already skipped by the packaging-keyed gate this replaces —
          # but it decides what happens the day one of them does.
          #
          # Every repo that lands here is ungated, which is why 'validate / conformance'
          # cannot become a required ruleset context yet: GitHub counts a skipped job as
          # SATISFYING a required check, so making it required now would mean "verified
          # nothing" scores as "passed". When it is added, 'validate / conformance-gate'
          # must be added with it — this job carries hard failures of its own (an
          # unreadable definition, an unknown kind, unpackaged Python), and each of them
          # leaves 'validate / conformance' reporting a green-counting Skipped.
          if kind not in ASSESSABLE_KINDS:
              print(
                  f"::warning::Tier-1 conformance NOT ASSESSED: the kit carries no "
                  f"behaviour check for connector kind {kind!r}."
              )
              summary(
                  f"### Tier-1 conformance: NOT ASSESSED\n\n"
                  f"This connector declares `kind: {kind}`. The tier-1 checks that "
                  f"certify how a connector reads and renders SQL declare "
                  f"`APPLIES_TO_KINDS = (\"database\",)`, so none of them apply here, "
                  f"and the kit carries no equivalent for this kind yet. The checks "
                  f"that are kind-agnostic — the definition, type-map and "
                  f"override-surface ones — would still have applied; they are "
                  f"skipped along with the rest, so this run is no evidence either "
                  f"way. API coverage is analitiq-engine#415."
              )
              emit("run", "false")
              sys.exit(0)

          # Assessable kind. The package decides only WHAT gets installed: a packaged
          # connector adds `.` to the single pip resolution so its own class and driver
          # requirements are importable; a thin one installs the CDK alone and is
          # audited through GenericSQLConnector.
          emit("run", "true")
          emit("install_self", "true" if declares_package else "false")
          if not declares_package:
              # ::notice:: rather than a bare print. A thin connector's green is a
              # materially narrower assurance than a packaged one's, and nothing on
              # the checks list would otherwise distinguish them — the caveat cannot
              # live only in a log line and a summary nobody opens.
              print(
                  f"::notice::Thin connector (kind={kind!r}, no [project] table): the CDK's "
                  f"GenericSQLConnector stands in for the connector class. Only the "
                  f"checks that need a bespoke class lose their subject; the rest "
                  f"still apply, on whatever the definition itself supplies — the "
                  f"type-map checks need type maps, the dialect checks need the "
                  f"declared driver's SQLAlchemy dialect importable."
              )
              summary(
                  f"### Tier-1 conformance: thin connector\n\n"
                  f"This repo declares no Python package, so the suite audits the "
                  f"CDK's `GenericSQLConnector` in place of a class of its own. A "
                  f"green here certifies the definition, whichever type maps the repo "
                  f"ships, and the declared driver's dialect — not connector code, of "
                  f"which there is none. Checks whose input is absent skip rather "
                  f"than fail (a missing *read* map is the exception: the kit fails "
                  f"that one outright), so read the `-rs` skip list in the suite step "
                  f"before treating a green as coverage."
              )
          PY

  # Tier-1 CDK conformance (.github#8). The `validate` job never imports
  # connector.py, so a connector can be green on every definition file and still
  # break at runtime: a wrong sqlalchemy_registry_name, a dialect package missing
  # from requirements.txt, an unsanctioned override of a CDK hook.
  #
  # A separate job rather than steps inside `validate`, for two reasons: the CDK +
  # connector install must not share a dependency resolution with the validator
  # install, and an independent failure signal is more readable. In a caller repo
  # the stub's job is 'validate' and this job is 'conformance', so the status check
  # is 'validate / conformance'.
  #
  # Tier 2 (live read/write against a real server) needs a service container matched
  # to each system — postgres vs. mysql vs. snowflake — which a shared workflow_call
  # cannot supply generically, and cloud warehouses have no containerizable server at
  # all. Tier 2 stays opt-in per connector repo.
  #
  # NOTE ON EDITING: every caller stub resolves this workflow at @main with no tag or
  # SHA pin, so a commit to main takes effect in all 13 connector repos at once, with
  # no per-repo rollout to catch a regression first. Anything that changes what this
  # job accepts or rejects — the CDK floor, the gate's conditions, the pytest
  # invocation — should be piloted before merge against the repos the change actually
  # moves, which are not always the packaged ones: .github#11 widened the gate to thin
  # connectors, and piloting it against the packaged five would have shown nothing.
  conformance:
    needs: conformance-gate
    if: needs.conformance-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Same precedence contract as VALIDATOR_VERSION above: caller repo variable >
      # org variable > the literal floor, because GitHub evaluates `vars` in a
      # reusable workflow against the CALLER's repo. Roll a new CDK out org-wide by
      # setting the org variable CDK_VERSION, not by editing this file. The literal
      # is the floor fork PRs actually run against, since they receive no org or repo
      # variables and an unset `vars` entry expands to an empty, invalid pip spec.
      #
      # The floor must name a release whose kit FAILS a connector kind it cannot
      # assess (analitiq-engine#414), because this job reports its result as a status
      # check and a skip-only run is indistinguishable from a pass there. Verified
      # against the `pipedrive` definition (kind: api), a kind no tier-1 check declares
      # support for: 0.2.0rc1 reports 4 passed / 20 skipped and exits 0 — the four that
      # pass are the kind-agnostic ones, so "not assessed" is rendered
      # as "passed" — while 0.2.1 fails test_a_check_applies_to_this_connector_kind
      # and exits 1. 0.2.1 is the first PyPI release carrying that check, so it is the
      # floor. The install step enforces the floor on the RESOLVED value, since the
      # variable that actually decides is set in org/repo settings where this comment
      # is not visible.
      CDK_VERSION: ${{ vars.CDK_VERSION || '0.2.1' }}

      # One definition of the target, inherited by every step and by the kit itself.
      # The verify step and the suite MUST agree on this; when they disagreed, the
      # verify step certified a resolution the suite never performed, and it did so
      # with an affirmative green rather than an error.
      ANALITIQ_CONNECTOR_DIR: ${{ github.workspace }}

      # 'true' when the gate found a [project] table, 'false' for a thin connector.
      # Read by BOTH the install step, which appends `.` to the pip resolution, and
      # the verify step, which uses it to decide which class this run SHOULD have
      # resolved. Keep it job-level: those two steps must answer from one verdict,
      # and demoting it to a step-level env on the install step is exactly the
      # refactor that would give the verify step back a second definition of "thin".
      INSTALL_SELF: ${{ needs.conformance-gate.outputs.install_self }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Unlike `validate`, which only ever parses JSON, this job executes
          # PR-controlled code three times over: the fork's build backend under
          # build isolation, its requirements.txt, and connector.py itself when
          # pytest imports it. Don't leave the job token in .git/config for that
          # code to read. Corollary: caller stubs must never gain `secrets: inherit`.
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'   # the kit's floor is 3.11

      # The suite and the verify step must run outside the checkout, and in the SAME
      # place. Defined once here rather than as a literal in each step: this is the one
      # invariant in this job whose regression mode is a green check rather than a red
      # one, so it should not depend on two strings staying equal.
      - name: Prepare an isolated run directory
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/conformance-run"
          echo "RUN_DIR=$RUNNER_TEMP/conformance-run" >> "$GITHUB_ENV"

      - name: Install pinned CDK + this connector
        run: |
          set -euo pipefail
          echo "Conformance CDK (requested): ${CDK_VERSION}"
          python3 -m pip install --quiet packaging

          # The floor documented above governs only the literal in this file. The
          # value that actually gates a normal PR comes from an org or repo variable,
          # so assert it here: a stale override must not silently restore a kit that
          # exits 0 on a connector kind it cannot assess. Malformed values raise
          # InvalidVersion, which also fails the step.
          python3 -P - <<'PY'
          import os, sys
          from packaging.version import Version
          floor = Version("0.2.1")
          got = Version(os.environ["CDK_VERSION"])
          if got < floor:
              sys.exit(
                  f"CDK_VERSION={got} is below the {floor} floor. Releases before "
                  f"{floor} exit 0 on a connector kind they cannot assess "
                  f"(analitiq-engine#414), which makes this gate vacuous. Refusing to run."
              )
          PY

          # ONE resolution for the CDK and the connector. Two separate `pip install`
          # calls do not share one: the second cannot see the first's constraints and
          # will downgrade a shared dependency to satisfy requirements.txt, at which
          # point pip prints "ERROR: ... dependency conflicts" and still exits 0
          # (verified). A gate running against a different CDK than the one it just
          # echoed is worse than no gate. Installing the connector matters for tier 1,
          # not just tier 2 — the suite resolves a SQLAlchemy dialect for the declared
          # driver and fails, not skips, when the dialect package is absent from the
          # connector's requirements or sqlalchemy_registry_name is wrong.
          #
          # `.` is appended only for a repo that declares a package, so a thin
          # connector reaches that check with nothing but the CDK's own dependencies
          # on the path. Its driver's dialect is then importable only if SQLAlchemy
          # ships it: mariadb's built-in mariadb+pymysql resolves, duckdb's
          # third-party duckdb_engine does not, and duckdb fails the read-path checks
          # with no way to fix it while staying thin (.github#14). Installing `.`
          # anyway is not the workaround — for both thin repos in the catalogue pip
          # refuses either way, and says so: "Directory '.' is not installable" with no
          # pyproject.toml, and "Multiple top-level packages discovered in a
          # flat-layout: ['media', 'definition']" with a [project]-less one (verified
          # on a duckdb checkout, pip 26.1.2 / setuptools 83). Don't read that second
          # message as universal: it needs two non-excluded top-level directories.
          # duckdb and mariadb both carry media/ and definition/, but pipedrive ships
          # no media/, and setuptools would build its lone definition/ into a
          # distribution named `definition` rather than refusing. Which is why the
          # branch below keys on the gate's verdict and not on pip's willingness.
          TARGETS=("analitiq-cdk[conformance]==${CDK_VERSION}")
          case "${INSTALL_SELF}" in
            true)
              TARGETS+=(".")
              ;;
            false)
              echo "Thin connector: installing the CDK alone, with no local package."
              ;;
            *)
              # Never fall through to the thin path on an unexpected value: for a
              # packaged repo it would install no connector class, and the suite would
              # audit CDK code. The verify step below catches that, but under a title
              # that points at entry points rather than at this.
              echo "INSTALL_SELF is '${INSTALL_SELF}', expected 'true' or 'false'." >&2
              echo "It comes from the conformance-gate job's install_self output; if" >&2
              echo "that job is green, look at how this job reads its outputs." >&2
              exit 1
              ;;
          esac
          python3 -m pip install "${TARGETS[@]}"

          # pip exits 0 on an inconsistent resolution; pip check exits 1. This is the
          # step that turns that warning into a failure.
          python3 -m pip check

          # ...and prove the pin survived, so the echoed version is a record rather
          # than a claim.
          python3 -P - <<'PY'
          import os, sys
          from importlib.metadata import version
          from packaging.version import Version
          want, got = os.environ["CDK_VERSION"], version("analitiq-cdk")
          if Version(got) != Version(want):
              sys.exit(f"CDK pin not honoured: requested {want}, installed {got}")
          print(f"Conformance CDK (installed, verified): {got}")
          PY

      # Entry-point resolution failing is indistinguishable from a pass without this.
      # When no entry point in analitiq.source_connectors / analitiq.destination_connectors
      # matches connector_id, the kit substitutes its own GenericSQLConnector for
      # `kind: database` and the suite audits CDK code instead of the repo's. Verified:
      # renaming postgres's entry point to `postgresql` flips
      # test_override_surface_is_sanctioned from fail to pass — one of the three defect
      # classes this job exists to catch — because PostgresConnector was never loaded.
      # Nothing else in the run reports it: install, pip check, the pin assertion and
      # -rs all stay clean.
      #
      # Runs from the same directory as the suite below. `python3 -` puts the cwd
      # on sys.path, and importlib.metadata scans sys.path, so checking from inside the
      # checkout can see entry points the real run cannot — a checkout-resident
      # *.egg-info is enough. Verified: from the checkout this step reported the repo's
      # own class and exited 0 while the suite resolved GenericSQLConnector. Both must
      # stand in the same place or this guard certifies the wrong environment.
      - name: Verify the suite will audit this repo's connector class
        run: |
          set -euo pipefail

          cd "$RUN_DIR"
          python3 - <<'PY'
          import os, pathlib, sys
          from cdk.conformance.target import ConformanceSetupError, load_target
          from cdk.sql.generic import GenericSQLConnector

          root = pathlib.Path(os.environ["ANALITIQ_CONNECTOR_DIR"])
          try:
              target = load_target(root)
          except ConformanceSetupError as err:
              # load_target is fail-loud for far more than entry points (unreadable
              # connector.json, malformed sql_capabilities, an empty type-map-write).
              # Name that rather than letting a bare traceback masquerade as an
              # entry-point problem under this step's title.
              sys.exit(f"the conformance kit cannot load this connector: {err}")

          cls = target.connector_class
          origin = "none" if cls is None else f"{cls.__module__}.{cls.__qualname__}"
          print(f"connector_id: {target.connector_id!r} (kind={target.kind!r})")
          print(f"class under test: {origin}")

          # Which class this run SHOULD have resolved follows from whether the install
          # step installed one, and that is the gate's verdict — read it, don't
          # re-derive it. Probing for a root connector.py here — as the first two
          # revisions of .github#11 did — asks a different question, and gets it wrong
          # for any repo whose class is not at that exact path. A packaged src/-layout
          # repo with a misnamed entry point resolved GenericSQLConnector, and this
          # step announced "thin connector" and exited 0: the very defect its header
          # comment above describes, waved through. The revision that added an
          # assertion to that branch then got the other direction wrong too, failing
          # the same repo with a CORRECT entry point for resolving its own class.
          # One definition of thin, for the same reason ANALITIQ_CONNECTOR_DIR is one
          # definition of the target.
          if os.environ["INSTALL_SELF"] == "false":
              # Nothing of this repo's was installed, so the kit's own answer is the
              # expected one — but WHICH answer that is depends on the kind.
              # _resolve_connector_class substitutes GenericSQLConnector for
              # `kind: database` and returns None for every other kind, so a database
              # connector resolving None means the substitution did not happen: the
              # suite would run with nothing under test and skip its way to green.
              # That is the same silent pass the packaged branch below guards against,
              # reached through a behaviour change in the kit rather than a moved
              # class — which the module-level import cannot catch, so this must.
              #
              # Tolerating None for OTHER kinds is what keeps this correct when
              # analitiq-engine#415 grows ASSESSABLE_KINDS: a thin api connector
              # resolving None is then the CDK's documented outcome, not a defect.
              # Today `database` is the only kind that reaches this branch at all.
              if target.kind == "database" and cls is None:
                  sys.exit(
                      f"the CDK substitutes GenericSQLConnector for kind: database "
                      f"when no entry point matches connector_id, but conformance "
                      f"resolved no class at all. The fallback did not happen, so the "
                      f"suite would run with nothing under test. Look at what changed "
                      f"in analitiq-cdk {os.environ['CDK_VERSION']}."
                  )
              # Anything else means a connector class reached this environment from
              # somewhere this job did not put it.
              if cls is not None and cls is not GenericSQLConnector:
                  sys.exit(
                      f"the gate found no installable package, so the CDK's generic "
                      f"class is expected here, but conformance resolved {origin}. "
                      f"Something installed a connector class this job did not."
                  )
              print(
                  f"no [project] table — thin connector, {origin} is the expected "
                  f"stand-in"
              )
              sys.exit(0)

          # Identity, not a module-name prefix: this asks exactly "did the kit
          # substitute its fallback". If the generic class is ever moved or renamed the
          # import above raises and this step goes red — loudly wrong rather than
          # quietly answering the wrong question, which is the right direction here.
          if cls is None or cls is GenericSQLConnector:
              sys.exit(
                  f"this repo declares an installable package but conformance resolved "
                  f"{origin}. No entry point named {target.connector_id!r} in "
                  f"analitiq.source_connectors / analitiq.destination_connectors points "
                  f"at its class, so the suite would audit CDK code and report green. Fix "
                  f"the entry-point name in pyproject.toml — it must equal connector_id."
              )
          PY

      - name: Tier 1 conformance
        run: |
          set -euo pipefail

          # -p cdk.conformance.plugin loads the kit's option plugin; it is deliberately
          # not a pytest11 auto-load entry point. Discovery is by the entry-point groups
          # analitiq.source_connectors / analitiq.destination_connectors, keyed
          # (case-insensitively) on name == connector_id.
          #
          # Run from a directory of our own and point the kit at the checkout through
          # ANALITIQ_CONNECTOR_DIR rather than --connector-dir. pytest determines its
          # rootdir before plugin options are registered, so it treats the
          # --connector-dir VALUE as a positional path: the connector repo becomes
          # rootdir no matter what the cwd is, and its own pyproject.toml and
          # conftest.py are loaded as config for this run. That is a waiver mechanism
          # the suite is designed not to have — verified, a repo-root conftest.py with
          # `pytest_sessionfinish` setting `session.exitstatus = 0` makes a connector
          # with three real failures exit 0. Via the env var there is no positional
          # path, rootdir stays in our own directory, and neither file is read
          # (verified: the same hostile conftest then exits 1).
          #
          # A dedicated subdirectory rather than RUNNER_TEMP itself, which is shared
          # scratch: anything that drops a pytest.ini / tox.ini / setup.cfg there would
          # reopen the same hijack one level up. -o addopts= -o pythonpath= is
          # belt-and-braces should the cwd ever move back into the checkout.
          #
          # -rs prints skip reasons, so "passed" stays distinguishable from "not
          # assessed" in the log rather than being inferred from a bare count.
          cd "$RUN_DIR"
          pytest -p cdk.conformance.plugin \
            --pyargs cdk.conformance.tier1 \
            -o addopts= -o pythonpath= \
            -rs
